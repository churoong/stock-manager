<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>연결이 끊겼습니다</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0f172a; color: #e2e8f0; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        line-height: 1.7;
      }
      .box { max-width: 420px; }
      h1 { font-size: 17px; margin: 0 0 8px; }
      p { font-size: 13px; color: #94a3b8; margin: 0 0 6px; }
      .notice { margin-top: 28px; font-size: 11px; color: #64748b; }
      button {
        margin-top: 16px; padding: 8px 14px; border-radius: 10px; border: 1px solid #334155;
        background: #e2e8f0; color: #0f172a; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>연결이 끊겼습니다</h1>
      <p>이 앱은 저장된 숫자를 오프라인에서 보여 주지 않습니다. 옛 시세를 지금 값으로 착각하는 것이 더 위험하기 때문입니다.</p>
      <p>연결이 돌아오면 다시 불러오세요.</p>
      <button onclick="location.reload()">다시 시도</button>
      <!-- 책임 고지 — CLAUDE.md 절대 규칙 "모든 화면 하단". 이 파일은 React 밖이라 <Footer /> 를 못 쓴다 (docs/infra.md 25.232) -->
      <p class="notice">투자 판단의 책임은 본인에게 있습니다.</p>
    </div>
  </body>
</html>
