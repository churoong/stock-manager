name: KIS모의투자 장중 손절·익절

# 국내 정규장 동안 10분마다 KIS모의투자 보유를 아침에 적어 둔 감시선(H 의 손절선·익절선)과 대 본다
# (docs/paper.md 15.11, docs/infra.md 25.1768 — 2026-10-23 사용자 지시). 닿으면 KIS 모의에서만 시장가로 판다.
# 시각·휴장일은 스크립트가 다시 본다(09:05~15:15 KST 밖이면 DB 를 열지 않고 끝난다).
# **한 잡이 장 끝까지 깨어 10분마다 돈다**(scripts/kis_guard_loop.py, docs/infra.md 25.1796). 10분 예약(`3-59/10`)은
# 2026-10-26 첫 날 09:03~09:33 네 회차가 하나도 시작하지 않았다 — Actions 예약은 몇 시간씩 늦는다. 시작은 국내 일일 배치
# (cron-job.org 가 08:27 에 깨운다)의 `guard_start` 잡이 이 워크플로를 깨워서, 잡 상한(6시간)에 닿으면 `chain` 잡이 스스로 다시
# 깨워서 잇는다. 아래 예약 넷은 그 사슬이 끊긴 날의 예비다(늦게 와도 남은 장을 돈다). repository_dispatch(kis-guard)로
# 깨워도 같다 — 단 10분마다 깨우면 기다리는 실행끼리 서로 밀어낼 뿐이라 걸지 않는다.
on:
  schedule:
    - cron: "3 0 * * 1-5" # 00:03 UTC = 09:03 KST (월~금)
    - cron: "3 2 * * 1-5" # 11:03 KST
    - cron: "3 4 * * 1-5" # 13:03 KST
    - cron: "33 5 * * 1-5" # 14:33 KST — 사슬은 보통 13:5x 에 이어지는데 그 뒤의 예비가 없었다(25.1796 교차검증)
  repository_dispatch:
    types: [kis-guard]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 닿은 종목만 세고 주문·알림은 내지 않음
        type: boolean
        default: true
      loop:
        description: 장 끝까지 10분마다(끄면 한 번만 — 장중에 끄고 돌리면 기다리던 사슬 실행을 밀어낸다). 예약·사슬 실행은 늘 켬
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# 앞 실행이 끝나기 전에 다음 예약이 오면 기다린다 — 두 실행이 같은 종목을 두 번 팔지 않게(줄 유일 색인도 막는다).
# 기다리는 실행은 하나만 남는다(새로 온 것이 앞서 기다리던 것을 취소) — 손으로 한 번만 돌리는 실행(loop 끔)이 사슬의 다음
# 실행을 밀어내면 그날 남은 장은 예비 예약이 잇는다
concurrency:
  group: kis-guard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 반복 실행은 장 끝까지(스크립트가 330분 뒤 새 회차를 열지 않고 사슬로 넘긴다). GitHub 호스트 잡 상한은 360분
    timeout-minutes: 350
    outputs:
      chain: ${{ steps.guard.outputs.chain }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 반복 실행은 회차마다 파이썬을 새로 띄운다 — 6시간 동안 회차마다 백엔드를 따로 고르면 도중에 Turso 복귀 표시가 생겨
      # 한 잡 안에서 DB 가 갈릴 수 있다(25.472·25.480 — 다른 워크플로와 같게 첫 단계에서 고정)
      - name: DB 백엔드 고정 (docs/infra.md 25.472·25.480)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DB_BACKEND: ${{ vars.DB_BACKEND }}
          D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 장중 감시
        id: guard
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DB_BACKEND: ${{ vars.DB_BACKEND }}
          D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          KIS_VTS_APP_KEY: ${{ secrets.KIS_VTS_APP_KEY }}
          KIS_VTS_APP_SECRET: ${{ secrets.KIS_VTS_APP_SECRET }}
          KIS_VTS_ACCOUNT: ${{ secrets.KIS_VTS_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFFLINE_MODE: "0"
          LOG_LEVEL: INFO
        # 공개 로그에는 줄 수만(예외 traceback 의 KIS 거부 문구·DB 오류가 남지 않게, 25.1772 — 다른 KIS 워크플로와 같다)
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          # 손 실행에서 loop 를 끈 것만 한 번 — 예약·repository_dispatch·사슬 실행은 inputs.loop 가 없거나 켬
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.loop }}" != "true" ]; then
            timeout --kill-after=30s 7m python -m batch.jobs.intraday_guard $ARGS 2>&1 | python scripts/ops_tee.py run.log
          else
            python scripts/kis_guard_loop.py $ARGS 2>&1 | python scripts/ops_tee.py run.log
          fi

      # 실패했거나 손으로 **한 번만** 돌린 실행만 비공개 운영 이슈로 — 평소 결과는 실행 기록(batch_runs)·텔레그램에 있다.
      # 반복 실행도 workflow_dispatch(guard_start·chain)로 오므로 loop 를 켠 실행은 빼야 날마다 6시간치 로그가 올라가지 않는다
      # (25.1796 교차검증 [권고]). 반복 실행이 취소·잡 상한으로 끝나면(cancelled) 올린다(25.1798)
      - name: 기록을 이슈로 내보내기
        if: always() && (failure() || cancelled() || (github.event_name == 'workflow_dispatch' && inputs.loop != true))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          python scripts/publish_output.py \
            --title "운영 출력 (클라우드 세션용)" \
            --file run.log \
            --note "KIS모의투자 장중 손절·익절 (${{ job.status }})"

  # 잡 상한에 닿았는데 장이 남았으면 같은 워크플로를 다시 깨운다(25.1796). 쓰기 권한(actions)은 **패키지를 설치하는 본체가 아닌
  # 잡**에만 — 일일 배치 keepalive 와 같은 원칙(25.986). gh 는 러너에 깔려 있다
  chain:
    needs: run
    if: always() && needs.run.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 다음 실행 깨우기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/kis-guard.yml/dispatches" \
            -f ref="${{ github.ref_name }}" -f "inputs[loop]=true" -f "inputs[dry_run]=${{ inputs.dry_run == true }}"
