name: 국내 수정주가

# 미조정 종가에 조정 계수를 씌워 adj_close 를 채운다 (docs/adjust.md).
# 원본(close)은 건드리지 않는다. 여러 번 돌려도 결과가 같다.
#
# 언제 돌리나: 국내 가격을 새로 받은 뒤. 백필을 --refresh 로 다시 돌린 뒤에는 반드시.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 한 종목만 (확인용, 비우면 전 종목)
        type: string
        default: ""
  # 국내 백필이 끝나면 이어서 돌린다
  repository_dispatch:
    types: [adjust-kr]

concurrency:
  group: adjust-kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
      TICKER: ${{ inputs.ticker }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 수정주가 채우기
        run: |
          if [ -n "$TICKER" ]; then
            python -m batch.jobs.adjust_kr --ticker "$TICKER"
          else
            python -m batch.jobs.adjust_kr
          fi
