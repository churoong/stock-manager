name: 백테스트·스트레스

# **매달 3일에 기본 파라미터로 한 번씩 돈다** (국내·미국, docs/infra.md 25.942, 2026-10-04 사용자 결정 "다 진행해").
# 기법 발굴 루프의 판정(docs/factors.md 12장 머리)은 "시장·달마다 그 달 첫 기본 실행" 만 세는데, 예약이 없어 사람이
# 돌릴 때만 쌓였고 2026-10-04 까지 판정은 전부 "판정 불가" 였다. 이 예약 실행이 그 달의 첫 기본 실행이 된다 —
# 판정 실행은 깨운 주체와 무관하게 "그 달 3~7일 첫 성공 기본 실행" 이다(docs/factors.md 12장 머리, 25.1437 — 예전 문구 "사람이 돌린
# 것은 세지 않는다" 는 기록으로 가를 수 없어 고쳤다). 3일인 것은 1·2일에 전체 백업·ETF 판정이 Turso 읽기를 몰아 쓰기 때문이다.
# 나머지(파라미터를 바꾼 비교 실행)는 수동이다.
#
# 결과에는 항상 경고가 붙는다. 상장폐지 종목이 DB 에 없어 생존편향이 있다.
# 경고가 붙은 결과로 규칙을 확정하지 않는다 (docs/backtest.md 1.2).
#
# 웹(`/api/backtest/run`)이 깨우면 파라미터가 따라온다. 길이 둘인 이유는 토큰 권한 때문이다.
#   workflow_dispatch  → inputs.*            (토큰에 Actions: write 가 있을 때)
#   repository_dispatch → client_payload.*   (Contents: write 만 있을 때. 포트폴리오가 쓰는 길)
# 어느 길로 와도 같은 값을 쓰도록 아래 env 에서 한 번만 고른다.
# **실행 이름에 예약 cron 을 싣는다** (docs/infra.md 25.1437, 29회차 P1) — GitHub 실행 목록에는 어느 cron 에서 왔는지 칸이 없어,
# 빠진 예약 따라잡기(`scripts/schedule_catchup.per_cron`)가 국내(17:11)·미국(19:11)을 따로 볼 수 있게. 예전엔 가장 늦은 미국
# 하나만 봐서 국내 예약이 빠지고 미국이 돌면 국내를 다시 깨우지 않았다
run-name: 백테스트 ${{ (github.event.schedule || inputs.missed_schedule) && format('예약 {0}', github.event.schedule || inputs.missed_schedule) || '수동' }}
on:
  schedule:
    - cron: "11 17 3 * *" # 매월 3일 17:11 UTC = 4일 02:11 KST — 국내 기본 실행
    - cron: "11 19 3 * *" # 매월 3일 19:11 UTC = 4일 04:11 KST — 미국 기본 실행 (같은 그룹이라 국내 뒤에 돈다)
  repository_dispatch:
    types: [backtest]
  workflow_dispatch:
    inputs:
      what:
        description: 무엇을 돌릴지
        type: choice
        options: [둘다, 백테스트, 스트레스, 장기문턱]
        default: 둘다
      market:
        description: 시장
        type: choice
        options: [KR, US]
        default: KR
      years:
        description: 백테스트 기간(년)
        type: string
        default: "5"
      top_n:
        description: 매월 고르는 종목 수 (장기문턱이면 동시 보유 상한)
        type: string
        default: "20"
      long_thresholds:
        description: 장기문턱 비교 값 (docs/backtest.md 7장)
        type: string
        default: "60,55,50"
      no_pit_universe:
        description: 비교용 — 시점 유니버스를 끄고 오늘 유니버스를 전 구간에 쓴다 (docs/backtest.md 1.3)
        type: boolean
        default: false
      trend_filter:
        description: 시장 추세 오버레이를 켠다 — 지수 < 200일선이면 비중 × 설정 배수 (docs/backtest.md 2.4)
        type: boolean
        default: false
      missed_schedule:
        description: 빠진 예약 따라잡기가 채운다 — 그 예약의 cron (사람은 비워 둔다, docs/infra.md 25.1305)
        type: string
        default: ""

# **앞 실행을 취소하지 않는다** (docs/infra.md 25.581, 감사). 예전에는 `cancel-in-progress: true` 라 국내를 요청하고 1~2분 안에
# 미국을 요청하면 국내가 조용히 취소됐다 — 웹은 두 번 다 "요청했습니다" 라고 했다. 같은 그룹이라 한 번에 하나씩 돈다
# (DB 쓰기가 겹치지 않는다). 대기는 GitHub 이 하나만 두므로 세 번째 요청은 두 번째 대기를 밀어낸다
concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 첫 실행에서 실제 소요를 재고 조정한다 [확인필요]
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
      # 시세 사본 (docs/infra.md 25.888) — 맞춰 둔 사본이 있으면 시세·종목만 읽는 SELECT 를 거기서 읽는다
      PRICE_REPLICA_PATH: .price-replica/prices.db
      # 두 길 중 온 쪽을 쓰고, 둘 다 비면 기본값. 기본값은 docs/backtest.md 의 것과 같아야 한다
      # 예약은 입력이 없다 — cron 줄로 시장을 가른다(backup.yml 과 같은 방식). 나머지는 기본값이라 `params.default = true` 다
      WHAT: ${{ inputs.what || github.event.client_payload.what || '둘다' }}
      # 따라잡기로 깨어난 미국 월 기준 실행도 미국으로 (25.1305)
      MARKET: ${{ (github.event.schedule || inputs.missed_schedule) == '11 19 3 * *' && 'US' || inputs.market || github.event.client_payload.market || 'KR' }}
      # 판정 실행을 기록으로 가르게 (29회차 P1, 25.1437) — schedule | catchup | workflow_dispatch | repository_dispatch, 커밋
      BACKTEST_TRIGGER: ${{ inputs.missed_schedule && 'catchup' || github.event_name }}
      YEARS: ${{ inputs.years || github.event.client_payload.years || '5' }}
      TOP_N: ${{ inputs.top_n || github.event.client_payload.top_n || '20' }}
      LONG_THRESHOLDS: ${{ inputs.long_thresholds || github.event.client_payload.long_thresholds || '60,55,50' }}
      NO_PIT: ${{ (inputs.no_pit_universe || github.event.client_payload.no_pit_universe) && '--no-pit-universe' || '' }}
      TREND: ${{ (inputs.trend_filter || github.event.client_payload.trend_filter) && '--trend-filter' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 시세 사본 꺼내기 (docs/infra.md 25.888)
        # **암호화본만 캐시에 둔다** (docs/infra.md 25.1249) — 공개 저장소라 평문 KRX 시세를 캐시에 두지 않는다
        id: replica_enc
        uses: actions/cache/restore@v4
        with:
          path: .price-replica-enc
          key: price-replica-enc-${{ github.run_id }}
          restore-keys: price-replica-enc-

      - name: 옛 평문 사본 꺼내기 (암호화본이 아직 없을 때만 — 옮겨 담고 다시 만들지 않게, 25.1249)
        if: ${{ steps.replica_enc.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v4
        with:
          path: .price-replica
          key: price-replica-${{ github.run_id }}
          restore-keys: price-replica-

      - name: 시세 사본 풀기
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bash scripts/replica_crypt.sh decrypt

      - name: 시세 사본 맞추기
        id: replica
        # 비었으면 Turso 월 읽기 진도가 허락할 때 처음부터 만든다(약 760만 행, 한 번). 못 맞추면 작업이 Turso 에서 읽는다
        run: python scripts/price_replica.py sync --path .price-replica/prices.db

      - name: 시세 사본 암호화
        id: replica_crypt
        if: ${{ steps.replica.outputs.changed == 'true' }}
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bash scripts/replica_crypt.sh encrypt

      - name: 시세 사본 넣어 두기
        if: ${{ (steps.replica.outputs.changed == 'true') && steps.replica_crypt.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .price-replica-enc
          key: price-replica-enc-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Turso 읽기 진도 문 (docs/infra.md 25.886)
        id: gate
        # 백테스트는 유니버스 전체의 여러 해 시세·재무를 읽는다 — 가장 무거운 작업이다 `[확인필요: 25.885 실측 읽기량]`.
        # 이번 달 읽기가 진도를 앞서면 미루고 `batch_runs` 에 "건너뜀" 과 이유를 남긴다(백테스트 화면이 보여 준다).
        # 문이 깨지면 들어간다(`|| true`)
        # 월 읽기량은 운영 수치라 공개 로그에는 줄 수만 (25.1307). 미루면 `batch_runs` 의 "건너뜀" 이 까닭을 적는다
        run: |
          set -o pipefail
          python scripts/turso_read_gate.py backtest 5000000 2>&1 | python scripts/ops_tee.py gate.txt || true

      - name: 백테스트
        if: ${{ steps.gate.outputs.deferred != 'true' && env.WHAT != '스트레스' && env.WHAT != '장기문턱' }}
        run: python -m batch.jobs.backtest --market "$MARKET" --years "$YEARS" --top-n "$TOP_N" $NO_PIT $TREND

      - name: 스트레스
        if: ${{ steps.gate.outputs.deferred != 'true' && env.WHAT != '백테스트' && env.WHAT != '장기문턱' }}
        run: python -m batch.jobs.stress --market "$MARKET"

      - name: 장기 신호 문턱 비교
        if: ${{ steps.gate.outputs.deferred != 'true' && env.WHAT == '장기문턱' }}
        run: |
          python -m batch.jobs.backtest --market "$MARKET" --years "$YEARS" --top-n "$TOP_N" \
            --only-long --long-thresholds "$LONG_THRESHOLDS" $NO_PIT $TREND
