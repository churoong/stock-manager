name: 종목 참고 분석 (지금 분석)

# 종목 화면의 "지금 분석" 단추가 깨운다 (docs/analysis.md 8장, docs/infra.md 25.1018). 유니버스 밖 종목 하나의
# 재무·성과 지표를 받고, 유니버스 전 종목 + 이 종목으로 점수를 내 참고 의견을 만든 뒤 텔레그램·알림 센터로 알린다.
# 2026-10-08 사용자 결정 "지금 분석(C)를 실행할 경우 관심종목에 자동으로 추가되고 분석이 완료되면 알람".
on:
  repository_dispatch:
    types: [analyze-stock]
  workflow_dispatch:
    inputs:
      stock_id:
        description: 종목 번호 (stocks.id)
        type: string
        required: true

permissions:
  contents: read
  issues: write # 기록을 이슈 코멘트로 내보낸다 (docs/infra.md 25.17)

concurrency:
  group: analyze-stock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # 재무·지표 수집을 부른다 — D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
      # 셸에 그대로 끼우지 않는다 — 환경변수로 넘기고 파이썬이 정수로만 받는다(주입 막기)
      STOCK_ID: ${{ github.event.client_payload.stock_id || inputs.stock_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: DB 백엔드 고정 (재무·지표·분석이 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 분석
        run: |
          set -o pipefail
          python -m batch.jobs.analyze_extra --stock-id "$STOCK_ID" --notify 2>&1 | python scripts/ops_tee.py run.log

      - name: 기록을 이슈로 내보내기
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          python scripts/publish_output.py \
            --title "운영 출력 (클라우드 세션용)" \
            --file run.log \
            --note "종목 참고 분석 (${{ job.status }})"
