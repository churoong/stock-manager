name: Turso 자동 복귀

# DB_BACKEND=auto 일 때 Turso 가 풀리면 스스로 돌아간다 (docs/infra.md 25.12).
# 순서: Turso 마이그레이션 → D1 의 사람이 넣은 데이터 옮기기(종목 번호 다시 맞춤) → 복귀 표시 →
#       빠진 날 국내 시세 → 포트폴리오 재계산 → 장중 감시·뉴스 후보
#
# 복귀 표시를 남기기 전까지는 Turso 가 풀려도 배치·웹이 D1 을 쓴다(25.12). 그래서 이 워크플로가 늦게 돌아도
# 옛 스키마의 Turso 를 읽는 틈은 없다. 일찍 돌수록 Turso 의 온전한 데이터로 일찍 돌아갈 뿐이다.
#
# **날짜를 박지 않는다** (2026-09-18 사용자 요청). Turso 리셋 날짜를 모른다 [확인필요: 결제 주기].
#   - 웹이 수시로 본다: 미국 뉴스 크론과 무응답 감시가 매시 (web/lib/tursoWatch.ts, 25.880).
#     풀린 것을 보면 이 워크플로를 repository_dispatch(turso-return)로 **한 번** 깨우고 텔레그램으로 알린다
#   - 예비로 하루 한 번(09:20 KST) 스스로도 본다. 웹이 깨우지 못하는 경우(토큰 없음 등)를 위한 것이다
# Actions 로 자주 폴링하지 않는다 — 짧은 작업도 1분으로 계산된다(CLAUDE.md 비용 규칙).
# 이미 돌아갔거나 아직 막혀 있으면 1분 안에 끝난다.
on:
  repository_dispatch:
    types: [turso-return]
  schedule:
    - cron: "20 0 * * *" # 매일 09:20 KST (예비)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 기록을 이슈 코멘트로 내보낸다 (docs/infra.md 25.17)
  actions: write # 메우기를 마치면 recompute.yml 을 깨운다 (25.881)

# **따라잡기와 복귀는 같은 줄에 선다** (docs/infra.md 25.463, 스케줄 감사 #6). 따로 서면 09:05 따라잡기가
# D1 에 쓰는 동안(제한 60분) 09:20 복귀가 사람이 넣은 데이터를 Turso 로 옮기고 복귀 표시를 남긴다 — 그 뒤
# 따라잡기의 남은 단계는 DB_BACKEND=auto 라 새 연결부터 Turso 를 보고, D1 예산으로 잰 백필을 Turso 에 쓴다.
# 같은 그룹이면 늦게 온 쪽은 앞쪽이 끝날 때까지 기다린다(기다리는 자리는 하나 — 새로 오면 옛 대기는 취소된다)
concurrency:
  group: db-backend-switch
  cancel-in-progress: false

jobs:
  return:
    if: ${{ vars.DB_BACKEND == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      # 2-0b 빠진 국내 공시(jobs/disclosures_kr)가 DART 를 부른다 (docs/infra.md 25.882)
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. 살펴보고 옮기기
        id: ret
        run: |
          set -o pipefail
          python scripts/turso_return.py 2>&1 | python scripts/ops_tee.py -a run.log
          # **아무 일도 하지 않은 실행은 이슈에 올리지 않는다** (docs/infra.md 25.84).
          # 이 워크플로는 매일 09:20 KST 에 돌고, 풀릴 때까지 날마다 같은 말을 한다.
          # 그런데 15분 전(09:05)에 따라잡기가 돈다 — 빈 코멘트가 그 결과를 덮으면
          # 10월 1일에 읽을 복귀 점검(25.80)이 가려진다.
          # 표식은 batch/core/entry.py 의 NOTHING_DONE — tests/test_daily_skip.py 가 묶어 둔다
          if grep -q '^실행하지 않음: ' run.log; then
            echo "did_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "did_work=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 2. 빠진 날 국내 시세 (전 종목)
        if: steps.ret.outputs.moved == 'true'
        # D1 로 운영한 동안 Turso 에 빠진 날. 시작일은 turso_return 이 Turso 의 마지막 국내 시세 다음 날로
        # 정한다(날짜를 박지 않는다). 이미 있는 날은 건너뛴다
        run: |
          set -o pipefail
          python -m batch.jobs.backfill_kr --from "${{ steps.ret.outputs.backfill_from }}" 2>&1 | python scripts/ops_tee.py -a run.log

      # **2단계 이후는 앞 단계가 실패해도 돈다** (docs/infra.md 25.429). 복귀 표시는 1단계가 이미 적어 다음 실행이
      # "이미 돌아갔습니다" 로 끝난다 — 여기서 건너뛰면 환율·공시·지수·미국 시세 구멍을 메울 길이 영영 없다.
      # 각 단계는 2단계(국내 시세)의 결과를 쓰지 않는다. 실패는 실행 전체를 실패로 남긴다
      - name: 2-0. 빠진 환율 (USDKRW)
        # **가장 늦게 눈치채는 자리다** (docs/infra.md 25.83). 환율은 `fx.LOOKBACK_DAYS=10`
        # 고정 창인데 그것을 부르는 것이 **미국 일일 배치**다 — D1 동안 쉬는 바로 그것(25.14).
        # 게다가 3단계는 `portfolio.yml` 과 달리 환율 단계 없이 재계산만 부른다.
        # 비어도 실패하지 않는다: `value_series` 의 `_carry` 가 앞 값을 이어 붙여
        # 미국 보유 종목이 **2주 묵은 환율**로 평가되고 화면에는 오늘 날짜로 찍힌다.
        # 한 심볼(KRW=X) 한 호출이라 가장 싸다 — 그래서 맨 앞이다
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' && steps.ret.outputs.fx_days != '0' }}
        run: |
          set -o pipefail
          python -m batch.jobs.fx --lookback "${{ steps.ret.outputs.fx_days }}" 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 2-0b. 빠진 국내 공시
        # `disclosures_kr.DEFAULT_DAYS = 7` — 주석 문구까지 환율과 같다(25.83).
        # 국내 일일 배치 안에서 도는데 그 배치는 D1 을 보고 있었다.
        # **메우는 값이 공짜다**: 회사당 호출 1회이고 날짜 구간은 그 한 호출의 인자라,
        # 7일을 받든 30일을 받든 호출 수가 같다. 그래서 환율 바로 뒤에 둔다
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' && steps.ret.outputs.disclosure_days != '0' }}
        run: |
          set -o pipefail
          # --strict: DART 가 점검(상태 800)이거나 실패가 잇달면 1 로 끝나 5단계 "메우기 끝 표시" 가 적히지 않는다 —
          # 다음 실행이 다시 메운다 (docs/infra.md 25.1076). 뒤 단계는 !cancelled() 라 그대로 돈다
          python -m batch.jobs.disclosures_kr --days "${{ steps.ret.outputs.disclosure_days }}" --strict 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 2-1. 빠진 지수 일봉 (베타·추세 필터)
        # **날짜를 박지 않는다.** 며칠이 비었는지는 1단계가 Turso 에 물어 정한다(25.82).
        # 여기가 비면 베타(25.65)와 국면이 함께 틀어진다. 게다가 **틀린 값이 그럴듯하게** 나온다 —
        # 구멍을 사이에 둔 하루치 수익률이 2주치가 되어 변동성·샤프·MDD 를 부풀린다.
        # 지수는 세 줄뿐이라 싸다. 시세보다 **먼저** 둔다 (25.20 과 같은 이유: 굶으면 안 되는 것이 앞)
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' && steps.ret.outputs.index_days != '0' }}
        run: |
          set -o pipefail
          python -m batch.jobs.index_prices --lookback "${{ steps.ret.outputs.index_days }}" 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 2-2. 빠진 미국 시세
        # 일일 배치의 창은 `US_LOOKBACK_DAYS=10` **달력일 고정**이다. Turso 는 2026-09-17 에
        # 잠겼고 복귀는 빨라야 10/1 이라, 구멍이 10일을 넘으면 그만큼 **영영 빈다**(25.82).
        # 국내는 2단계가 메우는데 미국에는 그런 것이 없었다.
        #
        # **거래대금 하한을 주지 않는다 — 전 종목을 메운다.** 후보만 메우면
        # "어떤 종목은 구멍이 있고 어떤 종목은 없는" 상태가 남고, 그것이 바로 이 항목이
        # 고치려는 모양이다(절반만 조용히 깨짐). 값도 싸다: 최악이 `MAX_CATCHUP_DAYS` 120달력일
        # ≈ 83거래일이고, 마스터가 3,000종목이어도 25만 행 — Turso 월 1,000만 행의 2.5% 다.
        # (마스터 실제 종목 수는 `[확인필요]`. 위 계산은 넉넉히 잡은 상한이다)
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' && steps.ret.outputs.us_days != '0' }}
        run: |
          set -o pipefail
          # --detect-drift: 쉬는 동안 분할·배당락이 난 종목을 재수집 대기열에 적는다 (docs/infra.md 25.601)
          python -m batch.jobs.backfill_us --lookback "${{ steps.ret.outputs.us_days }}" --detect-drift 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 3. 포트폴리오 재계산
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' }}
        run: |
          set -o pipefail
          python -m batch.jobs.portfolio 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 4. 장중 감시·뉴스 후보
        if: ${{ !cancelled() && steps.ret.outputs.moved == 'true' }}
        run: |
          set -o pipefail
          rc=0  # 국내가 실패해도 미국은 돈다 — bash -e 가 둘째 줄을 건너뛰지 않게 (docs/infra.md 25.415)
          python -m batch.jobs.monitor_targets --market KR 2>&1 | python scripts/ops_tee.py -a run.log || rc=1
          python -m batch.jobs.monitor_targets --market US 2>&1 | python scripts/ops_tee.py -a run.log || rc=1
          exit $rc

      - name: 5. 메우기 끝 표시
        # **앞 단계가 모두 성공했을 때만** 적는다 (docs/infra.md 25.469). 없으면 다음 실행(웹의 다음 깨우기·09:20 예약)이
        # 옮기기 없이 빠진 구간만 다시 메운다. 복귀 표시는 1단계가 적는다 — 뒤 단계의 파이썬이 Turso 를 보게
        if: ${{ success() && steps.ret.outputs.moved == 'true' }}
        run: |
          set -o pipefail
          python scripts/turso_return.py --mark-filled 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 6. 추천·적립 다시 계산 깨우기
        # 옮기기는 사람이 넣은 데이터뿐이라 Turso 의 점수·신호·적립은 D1 로 넘어가기 직전 그대로다 (25.881).
        # 다음 예약(화요일·매월)까지 기다리지 않는다. 메우기 끝 표시와 같은 조건이라 복귀마다 한 번 깨운다
        if: ${{ success() && steps.ret.outputs.moved == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh workflow run recompute.yml --ref "${{ github.ref_name }}" 2>&1 | python scripts/ops_tee.py -a run.log

      - name: 기록을 이슈로 내보내기 (클라우드 세션이 로그를 못 읽는다)
        # 멈췄든 끝났든 남긴다 — **멈춘 이유를 읽으려고** 두는 것이다 (docs/infra.md 25.21).
        # 다만 **아무 일도 안 한 날은 뺀다**(25.84). `!= 'false'` 이지 `== 'true'` 가 아니다 —
        # 스크립트가 죽으면 표식 줄이 아예 안 생기고, 그때는 그대로 올라가야 한다
        if: always() && steps.ret.outputs.did_work != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 공개 저장소로 옮긴 뒤에는 비공개 운영 저장소로 보낸다 (docs/public-repo.md, infra 25.978)
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          python scripts/publish_output.py \
            --title "운영 출력 (클라우드 세션용)" \
            --file run.log \
            --note "Turso 자동 복귀 (${{ job.status }})"
