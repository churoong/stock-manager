name: 성과 지표 계산

# 시세가 쌓인 뒤에 돈다. 주간 유니버스 갱신 다음 날로 잡는다.
on:
  schedule:
    - cron: "23 17 * * 1" # 17:23 UTC 월요일 = 화요일 02:23 KST
  repository_dispatch:
    types: [metrics]
  workflow_dispatch:
    inputs:
      window:
        description: 특정 기간만 (비우면 전부)
        type: choice
        options: ["", "1Y", "3Y", "5Y"]
        default: ""
      ticker:
        description: 특정 종목만
        type: string
        default: ""
      market:
        description: 한 나라만 (비우면 둘 다)
        type: choice
        options: ["", "KR", "US"]
        default: ""

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "8000000"
      LOG_LEVEL: INFO
      # 시세 사본 (docs/infra.md 25.888) — 맞춰 둔 사본이 있으면 시세·종목만 읽는 SELECT 를 거기서 읽는다
      PRICE_REPLICA_PATH: .price-replica/prices.db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 시세 사본 꺼내기 (docs/infra.md 25.888)
        uses: actions/cache/restore@v4
        with:
          path: .price-replica
          key: price-replica-${{ github.run_id }}
          restore-keys: price-replica-

      - name: 시세 사본 맞추기
        id: replica
        # 비었으면 Turso 월 읽기 진도가 허락할 때 처음부터 만든다(약 760만 행, 한 번). 못 맞추면 작업이 Turso 에서 읽는다
        run: python scripts/price_replica.py sync --path .price-replica/prices.db

      - name: 시세 사본 넣어 두기
        if: ${{ steps.replica.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .price-replica
          key: price-replica-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 계산
        run: |
          ARGS=""
          if [ -n "${{ inputs.window }}" ]; then ARGS="$ARGS --window ${{ inputs.window }}"; fi
          if [ -n "${{ inputs.ticker }}" ]; then ARGS="$ARGS --ticker ${{ inputs.ticker }}"; fi
          if [ -n "${{ inputs.market }}" ]; then ARGS="$ARGS --market ${{ inputs.market }}"; fi
          python -m batch.jobs.metrics $ARGS
