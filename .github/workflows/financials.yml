name: 재무 수집

# 분기 보고서가 나오는 시기에 맞춰 주 1회 돈다.
# 새 보고서만 추가되고 기존 스냅샷은 덮어쓰지 않는다.
on:
  schedule:
    - cron: "17 16 * * 0" # 16:17 UTC 일요일 = 월요일 01:17 KST
  repository_dispatch:
    types: [financials]
  workflow_dispatch:
    inputs:
      years:
        description: 최근 몇 개 회계연도
        type: string
        default: "5"
      year:
        description: 특정 연도만 (비우면 years 사용)
        type: string
        default: ""

concurrency:
  group: financials
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "500000"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 수집
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            python -m batch.jobs.financials --year ${{ inputs.year }}
          else
            python -m batch.jobs.financials --years ${{ inputs.years || 5 }}
          fi

      - name: 시점 조회 확인
        run: python scripts/check_pit.py 005930
