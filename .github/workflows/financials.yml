name: 재무 수집

# 분기 보고서가 나오는 시기에 맞춰 주 1회 돈다.
# 새 보고서만 추가되고 기존 스냅샷은 덮어쓰지 않는다.
on:
  schedule:
    - cron: "17 16 * * 0" # 16:17 UTC 일요일 = 월요일 01:17 KST
    # 다음 날 다시 — 월요일 실행이 다 받지 못했을 때만(DART 점검·불통이면 그 주 재무 갱신이 통째로 빠졌다, docs/infra.md 25.1087).
    # 월요일이 성공으로 끝났으면 `--skip-if-ran-within 3` 이 바로 끝낸다(partial 은 세지 않는다 — 25.320)
    - cron: "17 16 * * 1" # 16:17 UTC 월요일 = 화요일 01:17 KST
  repository_dispatch:
    types: [financials]
  workflow_dispatch:
    inputs:
      read_gate:
        description: 읽기 진도 문 — off 면 이 손 실행만 진도 문을 건너뛴다(한도 상수는 그대로, docs/infra.md 25.1794)
        type: choice
        options: ["on", "off"]
        default: "on"
      years:
        description: 최근 몇 개 회계연도
        type: string
        default: "5"
      year:
        description: 특정 연도만 (비우면 years 사용)
        type: string
        default: ""
      missed_schedule:
        description: 빠진 예약 따라잡기가 채운다 — 그 예약의 cron (사람은 비워 둔다, docs/infra.md 25.1305)
        type: string
        default: ""

concurrency:
  group: financials
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      # 손 실행에서 read_gate=off 면 비워 진도 문을 건너뛴다 — 예약 실행(inputs 없음)은 늘 이 값(25.1794)
      TURSO_READ_ESTIMATE: ${{ inputs.read_gate != 'off' && '500000' || '' }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 수집
        id: collect
        run: |
          RETRY=""
          if [ "${{ github.event.schedule || inputs.missed_schedule }}" = "17 16 * * 1" ]; then RETRY="--skip-if-ran-within 3"; fi
          if [ -n "${{ inputs.year }}" ]; then
            python -m batch.jobs.financials --year ${{ inputs.year }}
          else
            python -m batch.jobs.financials --years ${{ inputs.years || 5 }} $RETRY
          fi

      # 새·재편입 종목의 배당 (docs/infra.md 25.1823). 배당은 4·5월에만 그때 유니버스를 받아, 그 뒤 편입 종목은 다음 4월까지
      # 배당수익률이 결측이었다. 지난 배당 수집 뒤 편입된 종목만 — 화요일 재시도는 월요일에 실패한 회사만 다시 받는다
      # (`MAX_RETRY` 세 번까지, 실패한 실행의 횟수도 이어 센다 25.1856)
      - name: 새로 편입된 종목의 배당
        if: ${{ !inputs.year && !cancelled() }}
        # 진도선은 보지 않고 월 상한만 (25.1831·25.1832) — 단계마다 문을 다시 보면 앞 단계가 읽은 만큼 이 단계만 미뤄졌다.
        # 문을 통째로 끄면(예전 25.1831) 월말 핵심 작업 몫을 지키는 상한까지 꺼져 교차검증 [필수] 로 되돌렸다
        env:
          TURSO_READ_NO_PACE: "1"
        run: python -m batch.jobs.dividends --only-missing

      # 19회차 A1 (docs/infra.md 25.1317) — 사업보고서 스냅샷에 영업현금흐름을 더한다. 11-04 전에는 아무것도 안 한다
      # (11-03 국내 기본 백테스트를 반쯤 찬 자료로 판정하지 않게). 새 사업보고서도 이 단계가 채운다. 출력은 건수만
      # 새 편입 배당 **뒤**에 둔다(25.1855) — 첫 몇 주는 할 일이 수만 건이라 잡 상한(60분)을 다 써 뒤 단계가 끊겼다.
      # 실행 안의 시간 예산(`kr_cashflow.BUDGET_SECONDS`)도 둔다. 수집이 성공했을 때만(예전 조건과 같다 — 배당 단계가
      # 실패해도 돈다)
      - name: 국내 영업현금흐름 채우기
        if: ${{ !inputs.year && !cancelled() && steps.collect.outcome == 'success' }}
        env:
          TURSO_READ_NO_PACE: "1"  # 수집 뒤 단계 — 진도선 대신 월 상한만 (25.1832)
        run: python -m batch.jobs.kr_cashflow

      # 앞의 새 편입 배당 단계가 DART 한도로 실패해도 확인은 돈다 (25.1824)
      - name: 시점 조회 확인
        if: ${{ !cancelled() }}
        run: python scripts/check_pit.py 005930
