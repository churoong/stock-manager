name: 장중 감시 준비

# 정규장 세션(14일)과 감시 대상(보유·신호)을 다시 만든다 (docs/intraday.md).
# 평소에는 일일 배치 끝에서 돈다. 이 워크플로는 배치를 기다리지 않고 바로 만들 때(첫 설정, 관심 종목 외 대상 변경) 쓴다.
on:
  workflow_dispatch:
    inputs:
      market:
        description: 시장 (비우면 둘 다)
        type: choice
        options: ["", "KR", "US"]
        default: ""

concurrency:
  group: monitor-targets
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 준비
        run: |
          if [ -n "${{ inputs.market }}" ]; then
            python -m batch.jobs.monitor_targets --market ${{ inputs.market }}
          else
            # 국내가 실패해도 미국은 돈다 — `bash -e` 가 둘째 줄을 건너뛰지 않게 (docs/infra.md 25.415)
            rc=0
            python -m batch.jobs.monitor_targets --market KR || rc=1
            python -m batch.jobs.monitor_targets --market US || rc=1
            exit $rc
          fi
