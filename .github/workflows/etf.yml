name: ETF 장기 적립 판정

# 월 1회. 보수·순자산·설정일은 몇 주 사이에 거의 바뀌지 않고 이 화면은 타이밍을
# 보지 않는다. 주 1회면 Actions 분만 쓴다 (docs/etf.md 8.1).
# 매월 2일 17:19 UTC = 3일 02:19 KST. 월초 휴일·주말과 겹쳐도 상관없다(시세가 아니라 프로필을 본다).
on:
  schedule:
    - cron: "19 17 2 * *"
  repository_dispatch:
    types: [etf]
  workflow_dispatch:
    inputs:
      market:
        description: 시장
        type: choice
        options: [둘다, US, KR]
        default: 둘다
      satellite_only:
        description: "위성 판정만 (저장된 프로필로, 수집 없음. docs/etf.md 10장)"
        type: boolean
        default: false
      rejudge:
        description: "미국: 새로 받지 않고 저장된 프로필로 다시 판정 (규칙만 바꿨을 때)"
        type: boolean
        default: false
      max_profiles:
        description: 프로필을 받을 최대 개수 (비우면 1200). 시험은 50 정도로 — 줄이면 판정·프로필을 저장하지 않는다 (25.608)
        type: string
        default: ""
      only:
        description: 쉼표로 구분한 심볼만 판정 (시험용, 일봉 거르기 생략). 예 VOO,SPY,BND
        type: string
        default: ""

concurrency:
  group: etf
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 일봉 조각 약 20개(12분 안팎) + 프로필 최대 1,200개(개당 약 1.5초, 30분)
    timeout-minutes: 90
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      # 점수 담음(N-PORT)이 SEC 를 부른다 — 연락처 든 User-Agent (docs/data-sources.md 13.5·14절)
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # KODEX 구성종목을 못 받으면 KIS 상위 30 으로 (docs/infra.md 25.990)
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 국내는 한국거래소 21회 호출로 1~2분이면 끝난다. 미국보다 먼저 돌려
      # 미국 쪽이 막혀도 국내 결과는 남게 한다.
      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 국내 판정
        if: ${{ inputs.satellite_only != true && (inputs.market == '' || inputs.market == '둘다' || inputs.market == 'KR') }}
        run: python -m batch.jobs.etf --market KR

      # 국내 판정이 실패해도 미국은 돈다 — 기본 `if: success()` 가 통째로 건너뛰었다 (docs/infra.md 25.424)
      - name: 미국 판정
        id: us
        if: ${{ !cancelled() && inputs.satellite_only != true && (inputs.market == '' || inputs.market == '둘다' || inputs.market == 'US') }}
        run: |
          ARGS="--market US"
          if [ "${{ inputs.rejudge }}" = "true" ]; then ARGS="$ARGS --rejudge"; fi
          if [ -n "${{ inputs.max_profiles }}" ]; then ARGS="$ARGS --max-profiles ${{ inputs.max_profiles }}"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python -m batch.jobs.etf $ARGS

      # 위성은 위에서 저장한 프로필로 판정만 한다. 수집이 없어 1분 안쪽이다(docs/etf.md 10.5).
      # 위성은 미국 판정이 저장한 프로필을 쓴다 — 미국이 실패했을 때만 건너뛴다(국내 실패와는 무관, 25.424)
      - name: 위성 판정
        if: ${{ !cancelled() && steps.us.outcome != 'failure' }}
        run: python -m batch.jobs.etf_satellite

      # 우리 점수를 많이 담은 ETF (docs/etf.md 11.2, docs/infra.md 25.967). 핵심 판정이 저장한 가장 새 행에
      # N-PORT 보유 × 종합 점수 가중평균을 붙인다. 판정이 하나라도 실패했으면 그 시장의 가장 새 행이 지난 판정이라
      # 그대로 돌아도 된다(지난 행에 붙는다). 실패해도 판정 결과는 남는다 — 이 단계가 맨 끝이다
      - name: 점수 담음 (N-PORT)
        if: ${{ !cancelled() && inputs.satellite_only != true }}
        run: python -m batch.jobs.etf_tilt
