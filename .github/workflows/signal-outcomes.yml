name: 신호 성적표

# 지난 신호가 그 뒤 어떻게 됐는지 (docs/signals.md 10장). 주 1회면 충분하다 — 창이 거래일 단위라 매일 바뀌지 않는다.
on:
  schedule:
    - cron: "7 21 * * 1" # 21:07 UTC 월요일 = 화요일 06:07 KST (신호 배치 뒤)
  repository_dispatch:
    types: [signal-outcomes]
  workflow_dispatch:
    inputs:
      market:
        description: 시장
        type: choice
        options: [KR, US, 둘다]
        default: 둘다

concurrency:
  group: signal-outcomes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "2000000"
      LOG_LEVEL: INFO
      # 시세 사본 (docs/infra.md 25.888) — 맞춰 둔 사본이 있으면 시세·종목만 읽는 SELECT 를 거기서 읽는다
      PRICE_REPLICA_PATH: .price-replica/prices.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 시세 사본 꺼내기 (docs/infra.md 25.888)
        uses: actions/cache/restore@v4
        with:
          path: .price-replica
          key: price-replica-${{ github.run_id }}
          restore-keys: price-replica-

      - name: 시세 사본 맞추기
        id: replica
        # 비었으면 Turso 월 읽기 진도가 허락할 때 처음부터 만든다(약 760만 행, 한 번). 못 맞추면 작업이 Turso 에서 읽는다
        run: python scripts/price_replica.py sync --path .price-replica/prices.db

      - name: 시세 사본 넣어 두기
        if: ${{ steps.replica.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .price-replica
          key: price-replica-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 계산
        run: |
          MARKET="${{ inputs.market }}"
          if [ -z "$MARKET" ] || [ "$MARKET" = "둘다" ]; then
            # 국내가 실패해도 미국은 돈다 — `bash -e` 가 둘째 줄을 건너뛰지 않게 (docs/infra.md 25.415)
            rc=0
            python -m batch.jobs.signal_outcomes --market KR || rc=1
            python -m batch.jobs.signal_outcomes --market US || rc=1
            exit $rc
          else
            python -m batch.jobs.signal_outcomes --market "$MARKET"
          fi
