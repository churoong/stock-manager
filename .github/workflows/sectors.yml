name: 업종 채우기

# 유니버스 편입 종목의 업종을 공식 산업분류 중분류로 채운다 (batch/services/sectors.py).
# 업종은 거의 바뀌지 않아 월 1회. 국내 DART 약 4분, 미국 SEC 약 6분 [확인필요: 첫 실행 실측].
on:
  schedule:
    - cron: "43 18 3 * *" # 매월 3일 18:43 UTC = 4일 03:43 KST
  workflow_dispatch:
    inputs:
      market:
        description: 시장 (비우면 둘 다)
        type: choice
        options: ["", "KR", "US"]
        default: ""
      limit:
        description: 앞에서부터 몇 개만 (시험용, 비우면 전부)
        type: string
        default: ""

concurrency:
  group: sectors
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "300000"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 채우기
        run: |
          LIMIT=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT="--limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.market }}" ]; then
            python -m batch.jobs.sectors --market ${{ inputs.market }} $LIMIT
          else
            rc=0  # 국내가 실패해도 미국은 돈다 — bash -e 가 둘째 줄을 건너뛰지 않게 (docs/infra.md 25.415)
            python -m batch.jobs.sectors --market KR $LIMIT || rc=1
            python -m batch.jobs.sectors --market US $LIMIT || rc=1
            exit $rc
          fi
