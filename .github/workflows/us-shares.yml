name: 미국 주식수·시가총액

# SEC 주식수 × DB 종가로 미국 시가총액을, 가격 첫 관측일로 상장일을 채운다 (docs/factors.md 9.3).
# 미국 유니버스 갱신(universe.yml, 주 1회) 전에 돈다. 주식수는 분기 공시마다 바뀌므로 주 1회면 충분하다.
# 후보 약 2,900종목 × 최대 2회 호출, 초당 약 7회 → 15분 안팎 [확인필요: 첫 실행에서 실측].
on:
  schedule:
    - cron: "23 20 * * 6" # 토 20:23 UTC = 일 05:23 KST
  workflow_dispatch:
    inputs:
      min_turnover:
        description: 평균 거래대금 하한(달러). 0 이면 전 종목
        type: string
        default: "5000000"
      limit:
        description: 앞에서부터 몇 종목만 (시험용, 비우면 전부)
        type: string
        default: ""

concurrency:
  group: us-shares
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "300000"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 갱신
        run: |
          ARGS="--min-turnover ${{ inputs.min_turnover || '5000000' }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m batch.jobs.us_shares $ARGS
