name: DB 상태 확인 (읽기 전용)

# 폰·클라우드 세션에는 .env 가 없어 운영 DB 를 직접 읽을 수 없다. 여기서 읽는다.
# 쓰기 질의는 scripts/db_status.py 가 거절한다. 수동 실행만 한다(Actions 분 절약).
#
# **결과를 로그와 이슈 양쪽에 낸다.** 클라우드 세션은 Actions 로그 원문을 받지 못하고
# (프록시가 *.blob.core.windows.net 을 막는다) 이슈 API 만 읽을 수 있다 — 그래서 로그로만
# 내던 2026-09-19 이전에는 정작 이 워크플로가 클라우드에서 무용지물이었다 (docs/infra.md 25.17).
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 읽기 질의 하나 (비우면 기본 점검 묶음)
        type: string
        default: ""

permissions:
  contents: read
  issues: write # 결과를 이슈 코멘트로 내보낸다 (docs/infra.md 25.17)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # 입력을 셸에 직접 끼우지 않고 환경변수로 넘긴다 (명령 주입 방지)
      QUERY: ${{ inputs.sql }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 조회
        # tee 로 로그와 파일에 동시에 낸다. 파이프 뒤에 tee 가 있으므로 실패를 삼키지 않게 pipefail
        run: |
          set -o pipefail
          python scripts/db_status.py --sql "$QUERY" 2>&1 | python scripts/ops_tee.py db-status.txt

      - name: 결과를 이슈로 내보내기
        # 조회가 실패해도 그 오류를 읽어야 하므로 always(). 내보내기는 스스로 0 으로 끝난다
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 공개 저장소로 옮긴 뒤에는 비공개 운영 저장소로 보낸다 (docs/public-repo.md, infra 25.978)
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          python scripts/publish_output.py \
            --title "운영 출력 (클라우드 세션용)" \
            --file db-status.txt \
            --note "DB 상태 확인"
