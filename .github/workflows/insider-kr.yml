name: 국내 내부자 매매 수집

# 임원·주요주주 소유상황보고 (docs/data-sources.md 16.1). 근거표의 참고 행에만 쓴다.
# 주 1회. 회사당 1MB 응답을 879번 받으므로 다른 배치와 겹치지 않는 시각에 둔다.
# 소요 [확인필요: 첫 실행 실측]. 호출 간격 0.25초 × 879 = 최소 4분.
on:
  schedule:
    - cron: "20 18 * * 2" # 화 18:20 UTC = 수 03:20 KST
  workflow_dispatch:
    inputs:
      limit:
        description: 앞에서부터 몇 개만 (시험용, 비우면 전부)
        type: string
        default: ""
      lookback:
        description: 며칠치 (비우면 180)
        type: string
        default: ""

concurrency:
  group: insider-kr
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      # D1 임시 운영 중에는 쉰다 (docs/infra.md 25.14). Turso 로 돌아가면 저절로 다시 돈다
      SKIP_ON_D1: "1"
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      OFFLINE_MODE: "0"
      # Turso 월 읽기 진도 문 (docs/infra.md 25.1031) — 이번 달이 진도를 앞서면 이 작업을 미룬다. 값은 예상 읽기 행 수 [확인필요: 실측]
      TURSO_READ_ESTIMATE: "200000"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.lookback }}" ]; then ARGS="$ARGS --lookback ${{ inputs.lookback }}"; fi
          python -m batch.jobs.insider_kr $ARGS
