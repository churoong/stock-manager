name: 절대 한도·가격 깃 그림자 계측 (읽기 전용)

# 낸 KIS모의투자 주문이 가격 깃·거래대금 깃에 걸렸을 건수와 주문 크기 분포를 센다 (docs/paper.md 15.12, docs/infra.md 25.2284).
# 막지 않고 쓰지 않는다. 수동 실행만 — 달에 한 번, 발굴 회차 때. 금액이 들어 있어 공개 로그에 찍지 않는다.
# 출력은 운영 출력 규칙대로 공개 로그 대신 비공개 운영 저장소 이슈로 보낸다(scripts/ops_tee.py).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 결과를 이슈 코멘트로 내보낸다 (docs/infra.md 25.17)

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: 걸렸을 건수 세기
        run: |
          set -o pipefail
          python scripts/order_limits.py 2>&1 | python scripts/ops_tee.py order-limits.txt

      - name: 결과를 운영 이슈로
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_REPO: ${{ secrets.OPS_REPO }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          python scripts/publish_output.py \
            --title "운영 출력 (클라우드 세션용)" \
            --file order-limits.txt \
            --note "절대 한도·가격 깃 그림자 계측"
