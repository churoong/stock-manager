name: DB 백업

# 무료 플랜의 Turso 에는 자동 백업이 없다 (docs/backup.md).
# 사람이 넣은 매매·배당·설정은 어디서도 다시 만들 수 없다.
#
# 두 층으로 나눠 받는다. 아티팩트 보관 용량(무료 한도)을 아끼려는 것이다.
#   필수  매주 월요일. 작다. 90일 보관
#   전체  매월 1일. 크다. 30일 보관
on:
  schedule:
    - cron: "13 16 * * 0" # 일 16:13 UTC = 월 01:13 KST (필수)
    - cron: "47 16 1 * *" # 매월 1일 16:47 UTC = 2일 01:47 KST (전체)
    # 전체 백업 한 번 더 — 1일 것이 실패하면(2026-10-01 D1 읽기 한도로 실패, docs/infra.md 25.872) 보관 30일인 지난달 것이 만료돼
    # 한 달 동안 전체 백업이 0개였다. 8일에 한 번 더 받아 늘 하나는 남게 한다
    - cron: "47 16 8 * *" # 매월 8일 16:47 UTC = 9일 01:47 KST (전체, 예비)
  workflow_dispatch:
    inputs:
      scope:
        description: 무엇을 받을지
        type: choice
        options: [essential, full]
        default: essential

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # DB 백엔드 전환 (docs/infra.md 25절). 비어 있으면 Turso 를 쓴다
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      D1_ACCOUNT_ID: ${{ secrets.D1_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      OFFLINE_MODE: "0"
      # 월 1일·8일 예약은 전체, 나머지(주간 예약·수동)는 입력값이나 필수
      SCOPE: ${{ (github.event.schedule == '47 16 1 * *' || github.event.schedule == '47 16 8 * *') && 'full' || inputs.scope || 'essential' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB 백엔드 고정 (이 워크플로의 모든 단계가 같은 DB 를 쓴다, docs/infra.md 25.472·25.480)
        run: python -m batch.core.client --pin >> "$GITHUB_ENV"

      - name: Turso 읽기 진도 문 (전체 백업만, docs/infra.md 25.886)
        id: gate
        # 전체 백업은 모든 표를 한 번 읽는다 — 2026-10-02 실측 약 780만 행(시세 730만). 이번 달 읽기가 진도를 앞서면 미룬다.
        # 매월 8일 예비가 다시 해 본다. 필수 백업(작은 표)은 막지 않는다. 문이 깨지면 들어간다(`|| true`)
        # **8일 예비는 그달 1일 전체 백업이 성공했으면 건너뛴다** (25.887). 같은 `deferred` 출력으로 뒤 단계를 세운다
        if: ${{ env.SCOPE == 'full' }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 16 8 * *" ] && python scripts/backup_db.py --full-done-this-month; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/turso_read_gate.py backup 8500000 || true

      - name: 덤프
        id: dump
        if: ${{ steps.gate.outputs.deferred != 'true' }}
        # --record-run: `batch_runs` 에 실행 기록을 **연다** (docs/infra.md 25.167).
        # 그 전에는 백업이 아무 흔적도 안 남겨 **몇 주째 안 돌아도 알 길이 없었다**
        run: python scripts/backup_db.py --scope "$SCOPE" --out backup --record-run

      - name: 아티팩트로 올리기
        if: ${{ steps.gate.outputs.deferred != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.SCOPE }}
          path: backup/*.sql.gz

          # 필수는 오래, 전체는 짧게 둔다. 용량이 곧 비용이다
          retention-days: ${{ env.SCOPE == 'full' && 30 || 90 }}
          if-no-files-found: error

      - name: 실행 기록 닫기
        if: ${{ steps.gate.outputs.deferred != 'true' }}
        # **업로드가 끝난 뒤에 닫는다.** 덤프가 끝난 것과 내려받을 파일이 생긴 것은
        # 다른 일이다 — 먼저 닫으면 파일이 없는데 신선도 칸이 초록인 채가 된다.
        # 여기 못 오면 기록은 `running` 으로 남고 칸은 낡은 채다. 그것이 맞는 신호다
        run: >-
          python scripts/backup_db.py --scope "$SCOPE" --finish-run "${{ steps.dump.outputs.run_id }}"
          --rows-read "${{ steps.dump.outputs.rows_read || 0 }}"
